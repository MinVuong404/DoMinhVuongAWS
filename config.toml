baseURL = "https://dov005.github.io/DoMinhVuongAWS/"
relativeURLs = false
canonifyURLs = true
defaultContentLanguage = "vi"
buildFuture = true
buildDrafts = true

# Change the default theme to be use when building the site with Hugo
theme = "hugo-theme-learn"

# For search functionality
[outputs]
home = [ "HTML", "RSS", "JSON"]

[params]
  # Change default color scheme with a variant one. Can be "red", "blue", "green".
  themeVariant = "workshop"
  # Git hub repo link
  editURL = ""
  showVisitedLinks = true
  disableBreadcrumb = false
  disableNextPrev = false
  
[Languages]
[Languages.vi]
title = "Báo cáo thực tập :: AWS Serverless"
weight = 1
label = "Tiếng Việt"
[Languages.vi.params]
  description = "Báo cáo thực tập tốt nghiệp & Workshop Kỹ thuật Chuyên sâu: Xây dựng Hệ thống Nhận diện và Cảnh báo Email Lừa đảo 100% Serverless trên AWS"
  author = "Đỗ Minh Vương"

